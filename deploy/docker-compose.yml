services:
  bot:
    image: ${REGISTRY}/wheresmytrain:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: "3000"
    env_file:
      - .env
    volumes:
      - .env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
